<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishGuard AI - Agentic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-cyan-400"><i class="fas fa-shield-virus"></i> PhishGuard AI</h1>
            <p class="text-slate-400 text-sm italic">Autonomous Multi-Modal Phishing Detection System</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- INPUT PANEL -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg h-fit">
                <h2 class="text-lg font-semibold mb-4 text-cyan-300">Input Analysis</h2>
                
                <label class="block text-xs text-slate-500 mb-2 uppercase font-bold">Select Model Mode</label>
                <select id="modelSelect" class="w-full bg-slate-900 rounded-lg p-3 text-sm mb-4 border border-slate-700 outline-none focus:border-cyan-500">
                    <option value="qwen2.5:7b">Qwen 2.5 (Agentic)</option>
                    <option value="gemma:7b">Gemma 7b (Agentic)</option>
                    <option value="compare">Compare Models Side-by-Side</option>
                </select>

                <label class="block text-xs text-slate-500 mb-2 uppercase font-bold">Message Content</label>
                <textarea id="messageInput" rows="5" class="w-full bg-slate-900 rounded-lg p-3 text-sm mb-4 border border-slate-700 outline-none focus:border-cyan-500" placeholder="Paste the suspicious SMS/Email here..."></textarea>
                
                <label class="block text-xs text-slate-500 mb-2 uppercase font-bold">Screenshot (Optional)</label>
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-xs text-slate-400 mb-6 file:bg-cyan-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-lg cursor-pointer">
                
                <button onclick="startAnalysis()" id="analyzeBtn" class="w-full bg-cyan-600 py-3 rounded-lg font-bold hover:bg-cyan-500 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-brain"></i> RUN AGENT
                </button>
            </div>

            <!-- RESULTS PANEL -->
            <div id="resultsArea" class="flex flex-col gap-6">
                <!-- Single Model Terminal View -->
                <div id="singleView" class="space-y-6">
                    <div class="bg-black rounded-xl p-4 border border-slate-700 shadow-2xl">
                        <h3 class="text-xs font-bold text-cyan-500 mb-2 uppercase tracking-widest italic" id="singleTerminalTitle">Agent Logs (Qwen)</h3>
                        <div id="singleTerminal" class="custom-scrollbar h-48 overflow-y-auto font-mono text-[10px] text-cyan-400 space-y-1">
                            <div class="opacity-40">> Waiting for input...</div>
                        </div>
                    </div>
                </div>

                <!-- Compare Mode Terminal View -->
                <div id="compareView" class="hidden grid-cols-2 gap-4">
                    <div class="bg-black rounded-xl p-3 border border-slate-700 shadow-xl">
                        <h3 class="text-[10px] font-bold text-blue-400 mb-2 uppercase tracking-widest italic">Qwen Logs</h3>
                        <div id="qwenTerminal" class="custom-scrollbar h-48 overflow-y-auto font-mono text-[9px] text-blue-300 space-y-1">
                            <div class="opacity-40">> Waiting for input...</div>
                        </div>
                    </div>
                    <div class="bg-black rounded-xl p-3 border border-slate-700 shadow-xl">
                        <h3 class="text-[10px] font-bold text-purple-400 mb-2 uppercase tracking-widest italic">Gemma Logs</h3>
                        <div id="gemmaTerminal" class="custom-scrollbar h-48 overflow-y-auto font-mono text-[9px] text-purple-300 space-y-1">
                            <div class="opacity-40">> Waiting for input...</div>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="resultCardsContainer" class="flex flex-col gap-4">
                    <!-- Single Result Card -->
                    <div id="singleResultCard" class="hidden bg-slate-800 p-5 rounded-xl border-l-4 border-cyan-500 shadow-lg">
                        <div id="singleBadge" class="mb-3"></div>
                        <div class="text-xs text-slate-500 uppercase mb-2">Final Analysis:</div>
                        <p id="singleExplanation" class="text-sm text-slate-200 leading-relaxed font-light"></p>
                    </div>

                    <!-- Compare Mode Result Cards -->
                    <div id="compareResultCards" class="hidden grid-cols-2 gap-4">
                        <div class="bg-slate-800 p-4 rounded-xl border-t-4 border-blue-500 shadow-lg">
                            <h4 class="text-sm font-bold text-blue-400 mb-2"><i class="fas fa-robot"></i> Qwen Result</h4>
                            <div id="qwenBadge" class="mb-3"></div>
                            <p id="qwenExplanation" class="text-[11px] text-slate-300 leading-relaxed"></p>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border-t-4 border-purple-500 shadow-lg">
                            <h4 class="text-sm font-bold text-purple-400 mb-2"><i class="fas fa-microchip"></i> Gemma Result</h4>
                            <div id="gemmaBadge" class="mb-3"></div>
                            <p id="gemmaExplanation" class="text-[11px] text-slate-300 leading-relaxed"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = new WebSocket('ws://127.0.0.1:8000/ws');
        
        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                appendLog(data.model, data.message);
            } catch(e) {
                appendLog("system", event.data);
            }
        };

        function appendLog(model, msg) {
            const isCompare = document.getElementById('modelSelect').value === 'compare';
            const logHTML = `<span class="opacity-50">[${new Date().toLocaleTimeString()}]</span> > ${msg}`;
            
            if (isCompare) {
                const div = document.createElement('div');
                div.className = "border-b border-white/5 pb-1";
                div.innerHTML = logHTML;

                if (model.includes("qwen")) {
                    const t = document.getElementById('qwenTerminal');
                    t.appendChild(div); t.scrollTop = t.scrollHeight;
                } else if (model.includes("gemma")) {
                    const t = document.getElementById('gemmaTerminal');
                    t.appendChild(div); t.scrollTop = t.scrollHeight;
                } else {
                    const t1 = document.getElementById('qwenTerminal');
                    const t2 = document.getElementById('gemmaTerminal');
                    t1.appendChild(div.cloneNode(true)); t1.scrollTop = t1.scrollHeight;
                    t2.appendChild(div.cloneNode(true)); t2.scrollTop = t2.scrollHeight;
                }
            } else {
                const div = document.createElement('div');
                div.className = "border-b border-white/5 pb-1";
                div.innerHTML = logHTML;
                const t = document.getElementById('singleTerminal');
                t.appendChild(div);
                t.scrollTop = t.scrollHeight;
            }
        }

        async function startAnalysis() {
            const msg = document.getElementById('messageInput').value;
            const fileInput = document.getElementById('imageInput').files[0];
            const modelVal = document.getElementById('modelSelect').value;
            
            if(!msg) return alert("Please enter a message!");
            
            // UI Reset
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('analyzeBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> RUNNING...';
            
            const isCompare = modelVal === 'compare';
            
            // Toggle Views
            document.getElementById('singleView').classList.toggle('hidden', isCompare);
            document.getElementById('singleResultCard').classList.add('hidden');
            document.getElementById('compareView').classList.toggle('hidden', false);
            document.getElementById('compareView').classList.toggle('grid', isCompare);
            document.getElementById('compareView').classList.toggle('hidden', !isCompare);
            document.getElementById('compareResultCards').classList.add('hidden');
            
            if (isCompare) {
                document.getElementById('qwenTerminal').innerHTML = '';
                document.getElementById('gemmaTerminal').innerHTML = '';
            } else {
                document.getElementById('singleTerminalTitle').innerText = `Agent Logs (${modelVal.includes("qwen") ? "Qwen" : "Gemma"})`;
                document.getElementById('singleTerminal').innerHTML = '';
            }
            
            // Process Image if exists
            let base64 = null;
            if (fileInput) {
                const reader = new FileReader();
                base64 = await new Promise(resolve => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(fileInput);
                });
            }

            const endpoint = isCompare ? '/detect/compare' : '/detect/agentic';
            const payload = {
                content: msg,
                image_base64: base64,
                model: isCompare ? 'gemma:7b' : modelVal // default gemma model if compare
            };

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/v1${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (isCompare) {
                    displayCompareResults(data);
                } else {
                    displaySingleResult(data);
                }
            } catch (e) {
                appendLog("system", "ERROR: Connection Failed. Is the backend running?");
                console.error(e);
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('analyzeBtn').innerHTML = '<i class="fas fa-brain"></i> RUN AGENT';
            }
        }

        function createBadge(isPhishing) {
            return isPhishing 
                ? '<span class="bg-red-900/30 text-red-500 border border-red-500 px-3 py-1 rounded text-[10px] font-bold tracking-widest">CRITICAL: PHISHING DETECTED</span>'
                : '<span class="bg-green-900/30 text-green-500 border border-green-500 px-3 py-1 rounded text-[10px] font-bold tracking-widest">VERDICT: SECURE</span>';
        }

        function displaySingleResult(data) {
            const card = document.getElementById('singleResultCard');
            card.classList.remove('hidden');
            document.getElementById('singleBadge').innerHTML = createBadge(data.is_phishing);
            document.getElementById('singleExplanation').innerText = data.explanation;
        }

        function displayCompareResults(data) {
            const cards = document.getElementById('compareResultCards');
            cards.classList.remove('hidden');
            cards.classList.add('grid');
            
            // Process Qwen
            const qwenData = data['qwen2.5:7b'];
            if (qwenData) {
                document.getElementById('qwenBadge').innerHTML = createBadge(qwenData.verdict === 'Phishing');
                document.getElementById('qwenExplanation').innerText = qwenData.reasoning;
            }
            
            // Process Gemma
            const gemmaKey = Object.keys(data).find(k => k.includes('gemma'));
            const gemmaData = data[gemmaKey];
            if (gemmaData) {
                document.getElementById('gemmaBadge').innerHTML = createBadge(gemmaData.verdict === 'Phishing');
                document.getElementById('gemmaExplanation').innerText = gemmaData.reasoning;
            }
        }
    </script>
</body>
</html>
